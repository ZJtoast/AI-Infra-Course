<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Aira 动作预览</title>
<style>
:root{color-scheme:light dark;--bg:#eef4fa;--surface:#fff;--ink:#172438;--muted:#4e647a;--line:#c5d4e1;--tint:#e4f1fc;--blue:#174e81;--tile:#f2f7fc;--square:#eaf1f7}
@media(prefers-color-scheme:dark){:root{--bg:#15212d;--surface:#1e2a38;--ink:#edf4ff;--muted:#b4c4d5;--line:#46596d;--tint:#263f55;--blue:#b2d8ff;--tile:#263849;--square:#2b3e50}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Times New Roman",SimHei,sans-serif}header,main{max-width:1180px;margin:auto}header{padding:1.2rem 1.25rem .8rem;display:flex;align-items:baseline;gap:1rem}h1,h2,p{margin:0}h1{font-size:1.65rem}h2{font-size:1.35rem}small,.meta{color:var(--muted)}main{padding:0 1.25rem 1.25rem;display:grid;grid-template-columns:minmax(190px,270px) minmax(0,1fr);gap:1rem}.panel{background:var(--surface);border:1px solid var(--line);border-radius:.85rem;min-width:0}.catalog{padding:.75rem;display:flex;flex-direction:column;gap:.55rem}.list{overflow:auto;max-height:65vh;min-height:130px;scrollbar-width:thin}.list h3{margin:.55rem .45rem .2rem;font-size:.85rem;color:var(--muted)}button,input,select{font:inherit;color:inherit}button,select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.36rem .53rem}button,select{cursor:pointer}.catalog input,.catalog select{width:100%}.list button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:.38rem .6rem}.list button:hover,.list button[aria-pressed=true]{background:var(--tint);color:var(--blue)}.list button[aria-pressed=true]{font-weight:bold}.viewer{padding:1rem;align-self:start}.title,.controls,.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.title{justify-content:space-between}.title a{color:var(--blue)}.stage{margin:.7rem 0;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:.6rem;background-color:var(--tile);background-image:conic-gradient(var(--square) 25%,transparent 0 50%,var(--square) 0 75%,transparent 0);background-size:24px 24px;height:clamp(260px,52vh,500px)}canvas{display:block;width:100%;height:100%;min-height:0;object-fit:contain}.meta,output{font-variant-numeric:tabular-nums}.row{justify-content:space-between;margin:.5rem 0}input[type=range]{width:100%;margin:.25rem 0;accent-color:var(--blue)}.controls{margin-top:.4rem}.controls label{display:inline-flex;align-items:center;gap:.25rem}.mainbutton{font-weight:bold;min-width:4.5rem;background:var(--tint);color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #4488bc;outline-offset:2px}[hidden]{display:none!important}
@media(max-width:690px){header{padding:.7rem}.catalog{padding:.6rem}.list{max-height:16vh;min-height:60px}main{grid-template-columns:1fr;padding:0 .65rem .65rem;gap:.55rem}.viewer{padding:.65rem}.stage{height:clamp(205px,36vh,360px)}.controls{gap:.35rem}h1{font-size:1.35rem}}
</style>
</head>
<body>
<header><h1>Aira 动作预览</h1><small id="count"></small></header>
<main>
<aside class="panel catalog"><input id="query" type="search" aria-label="搜索动作名称或文件名" placeholder="搜索动作或文件名"><select id="group" aria-label="动作分类"><option value="">全部动作</option></select><nav class="list" aria-label="动作列表" id="list"></nav></aside>
<section class="panel viewer" aria-label="动作播放器">
<div class="title"><h2 id="title"></h2><a id="original" target="_blank" rel="noopener">原始资源</a></div>
<div class="stage"><canvas width="720" height="740" id="screen" role="img" aria-label="当前动作画面"></canvas></div>
<div class="row"><output id="frame"></output><output id="time"></output></div>
<input type="range" id="seek" min="0" value="0" aria-label="帧位置">
<div class="controls"><button id="prev" aria-label="上一帧">上一帧</button><button class="mainbutton" id="play">播放</button><button id="next" aria-label="下一帧">下一帧</button><label>速度 <select id="rate"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="{{DAILY_RATE}}">{{DAILY_RATE}}×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
<label><input id="loop" type="checkbox" checked>循环</label><label id="dirlabel">视线 <select id="direction"><option value="">正视</option><option value="n">上</option><option value="ne">右上</option><option value="e">右</option><option value="se">右下</option><option value="s">下</option><option value="sw">左下</option><option value="w">左</option><option value="nw">左上</option></select></label><label id="revlabel"><input type="checkbox" id="rev">反向过渡</label></div>
<p class="meta" id="status" role="status"></p></section>
</main>
<script type="application/json" id="rows">{{ACTION_ROWS}}</script>
<script type="application/json" id="media">{{NATIVE_MEDIA}}</script>
<script src="../framing.js?v={{FRAMING_HASH}}"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const rows=JSON.parse($("rows").textContent),native=JSON.parse($("media").textContent);
const groups=[...new Set(rows.map(r=>r[2]))],ctx=$("screen").getContext("2d");
for(const name of groups)$("group").add(new Option(name,name));
const cache=new Map();
function img(path){if(!cache.has(path)){const im=new Image();cache.set(path,new Promise((resolve,reject)=>{im.onload=()=>resolve(im);im.onerror=()=>{cache.delete(path);reject(Error("无法读取动作图片"));};im.src=path;}));}return cache.get(path);}
let selected,ends=[],duration=0,position=0,playing=false,last=0,raf=0,stamp=0,drawn=-1;
function list(){
 const q=$("query").value.trim().toLowerCase(),g=$("group").value,nav=$("list");nav.replaceChildren();let hits=0;
 for(const group of groups){const matches=rows.filter(([id,title,cat])=>(!g||g===cat)&&cat===group&&(id+" "+title).toLowerCase().includes(q));if(!matches.length)continue;
 const h=document.createElement("h3");h.textContent=group;nav.append(h);
 for(const row of matches){const b=document.createElement("button");b.type="button";b.dataset.id=row[0];b.textContent=row[1];b.setAttribute("aria-pressed",String(row===selected));b.onclick=()=>choose(row);nav.append(b);hits++;}}
 $("count").textContent=hits===rows.length?rows.length+" 个动作":hits+" / "+rows.length+" 个动作";if(!hits)nav.textContent="没有匹配的动作";
}
function timings([id,,group]){
 if(native[id])return native[id].spans;
 if(group==="待机"){const spans=id==="idle_sit"?{10:62,11:56,12:58,13:64}:id==="idle_prone"?{11:62,12:56,13:58,14:64}:{14:65,15:78,16:67};
 const values=Object.values(spans),normal=(3792-values.reduce((a,b)=>a+b,0))/(24-values.length);return Array.from({length:25},(_,i)=>i===24?0:spans[i]??normal);}
 const ms=group==="姿势过渡"?760/24:({poke:38,hearthands:52,tinyheart:55}[id]||40);
 return Array(25).fill(ms);
}
let choice=0;
async function choose(row){
 const ticket=++choice;
 const [id,title,group]=row,film=native[id];
 try{await img(film?"data:image/webp;base64,"+film.sheets[0]:id+".webp");}
 catch(e){if(ticket===choice)$("status").textContent=e.message;return;}
 if(ticket!==choice)return;
 halt();selected=row;location.replace("#"+id);$("title").textContent=title;$("original").href=(film?"../":"")+id+".webp";
 $("rate").value=group==="日常随机动作"?"{{DAILY_RATE}}":"1";$("loop").checked=group!=="日常随机动作";
 $("direction").value="";$("rev").checked=false;$("dirlabel").hidden=group!=="待机";$("revlabel").hidden=group!=="姿势过渡";
 let t=0;ends=timings(row).map(n=>t+=n);duration=t;$("seek").max=ends.length-1;position=0;drawn=-1;list();paint(0).then(()=>{if(selected===row && drawn===0 && !matchMedia("(prefers-reduced-motion: reduce)").matches)start();});}
async function paint(n){
 $("seek").value=n;$("frame").textContent="第 "+(n+1)+" / "+ends.length+" 帧";$("time").textContent=(position/1000).toFixed(2)+" / "+(duration/1000).toFixed(2)+" 秒";
 if(n===drawn)return;drawn=n;const id=selected[0],token=++stamp,film=native[id],view=$("direction").value;
 try{let image,overlay,w,h,x,y;
 const f=$("rev").checked?24-n:n;
 if(film){const page=Math.floor(n/12);image=await img("data:image/webp;base64,"+film.sheets[page]);w=360;h=336;x=n%4*w;y=Math.floor(n%12/4)*h;}
 else{image=await img(id+".webp");if(view&&!$("dirlabel").hidden)overlay=await img(id+"-"+view+".webp");w=image.naturalWidth/5;h=image.naturalHeight/5;x=f%5*w;y=Math.floor(f/5)*h;}
 if(token!==stamp)return;
 const c=$("screen"),scale=AiraFraming.scale(id,f);
 const [footX,footY]=film?AiraFraming.films[id].foot:[144,313];
 const dx=c.width/2-footX*scale,dy=660-footY*scale;
 const dw=(film?720:288)*scale,dh=(film?672:320)*scale;
 ctx.clearRect(0,0,c.width,c.height);
 ctx.drawImage(image,x,y,w,h,dx,dy,dw,dh);
 if(overlay)ctx.drawImage(overlay,x,y,w,h,dx,dy,dw,dh);
 $("status").textContent="";
 }catch(e){if(token===stamp){halt();$("status").textContent=e.message;drawn=-1;}}}
function halt(){playing=false;cancelAnimationFrame(raf);$("play").textContent="播放";}
function start(){if(playing)return;if(position>=duration)position=0;playing=true;last=performance.now();$("play").textContent="暂停";raf=requestAnimationFrame(tick);}
function tick(now){if(!playing)return;position+=(now-last)*Number($("rate").value);last=now;if(position>=duration){if($("loop").checked)position%=duration;else{position=duration;halt();paint(ends.length-1);return;}}
 const idx=ends.findIndex(v=>v>position);paint(idx<0?ends.length-1:idx);raf=requestAnimationFrame(tick);}
function seek(n){halt();n=Math.max(0,Math.min(ends.length-1,n));position=n?ends[n-1]:0;paint(n);}
$("query").oninput=list;$("group").onchange=list;$("play").onclick=()=>playing?halt():start();$("prev").onclick=()=>seek(Number($("seek").value)-1);$("next").onclick=()=>seek(Number($("seek").value)+1);$("seek").oninput=e=>seek(Number(e.target.value));
$("direction").onchange=$("rev").onchange=()=>{drawn=-1;paint(Number($("seek").value));};
document.addEventListener("visibilitychange",()=>{if(document.hidden)halt();});
window.addEventListener("hashchange",()=>{const row=rows.find(r=>r[0]===location.hash.slice(1));if(row&&row!==selected)choose(row);});
choose(rows.find(r=>r[0]===location.hash.slice(1))||rows[0]);
</script>
</body></html>
