<details class="appearance">
  <summary><span class="appearance-icon" aria-hidden="true"></span>外观</summary>
  <div class="appearance-panel">
    <fieldset><legend>明暗模式</legend>
      <div class="mode-options">
        <label><input type="radio" name="mode" value="light" checked><span>浅色</span></label>
        <label><input type="radio" name="mode" value="dark"><span>深色</span></label>
      </div>
    </fieldset>
    <fieldset><legend>主题色</legend>
      <div class="accent-options">
        <label data-accent="blue"><input type="radio" name="accent" value="blue" checked><span>海蓝</span></label>
        <label data-accent="teal"><input type="radio" name="accent" value="teal"><span>青碧</span></label>
        <label data-accent="green"><input type="radio" name="accent" value="green"><span>草绿</span></label>
        <label data-accent="purple"><input type="radio" name="accent" value="purple"><span>紫罗兰</span></label>
        <label data-accent="rose"><input type="radio" name="accent" value="rose"><span>玫红</span></label>
        <label data-accent="orange"><input type="radio" name="accent" value="orange"><span>暖橙</span></label>
      </div>
    </fieldset>
  </div>
</details>
