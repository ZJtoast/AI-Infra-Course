<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 234" role="img"><title>RoPE 半区配对的通道与旋转结果</title><defs><marker id="tip" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#315b80"/></marker></defs><rect width="800" height="234" rx="9" fill="#f4f8fc"/><g font-family="Times New Roman, SimHei, sans-serif" text-anchor="middle" fill="#142e43"><text x="176" y="30" font-size="20" font-weight="700">位置 1：按头宽分成两个半区</text><text x="625" y="30" font-size="20" font-weight="700">同一对输入共同决定两个输出</text><rect x="18" y="55" width="142" height="49" rx="6" fill="#d4eee7" stroke="#7597ad" stroke-width="1.5"/><text x="89.0" y="85.5" font-size="18" font-weight="400">通道 0：3</text><rect x="180" y="55" width="156" height="49" rx="6" fill="#ffedce" stroke="#7597ad" stroke-width="1.5"/><text x="258.0" y="85.5" font-size="18" font-weight="400">通道 128：4</text><rect x="28" y="142" width="292" height="42" rx="6" fill="#e4eff8" stroke="#7597ad" stroke-width="1.5"/><text x="174.0" y="169.0" font-size="18" font-weight="400">cos = 0，sin = 1</text><path d="M343 90 L431 90" stroke="#315b80" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><path d="M343 148 L431 148" stroke="#315b80" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><rect x="444" y="56" width="337" height="54" rx="6" fill="#d4eee7" stroke="#7597ad" stroke-width="1.5"/><text x="612.5" y="89.0" font-size="18" font-weight="400">通道 0：3 × 0 − 4 × 1 = −4</text><rect x="444" y="128" width="337" height="54" rx="6" fill="#ffedce" stroke="#7597ad" stroke-width="1.5"/><text x="612.5" y="161.0" font-size="18" font-weight="400">通道 128：4 × 0 + 3 × 1 = 3</text><text x="400" y="216" font-size="18" font-weight="400">下一对是通道 1 与通道 129，读取角度表里的下一项</text></g></svg>