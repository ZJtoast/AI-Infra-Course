<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 234" role="img"><title>专家输出的两个槽位合回同一 token</title><defs><marker id="tip" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#315b80"/></marker></defs><rect width="800" height="234" rx="9" fill="#f4f8fc"/><g font-family="Times New Roman, SimHei, sans-serif" text-anchor="middle" fill="#142e43"><text x="123" y="31" font-size="20" font-weight="700">token 0 的路由记录</text><text x="400" y="31" font-size="20" font-weight="700">按槽号读取专家输出</text><text x="674" y="31" font-size="20" font-weight="700">同一 token 的输出</text><rect x="9" y="49" width="219" height="53" rx="6" fill="#d4eee7" stroke="#7597ad" stroke-width="1.5"/><text x="118.5" y="81.5" font-size="18" font-weight="400">槽 9，权重 ¼</text><path d="M232 75 L270 75" stroke="#315b80" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><rect x="280" y="49" width="231" height="53" rx="6" fill="#d4eee7" stroke="#7597ad" stroke-width="1.5"/><text x="395.5" y="81.5" font-size="18" font-weight="400">[8, 0] × ¼ = [2, 0]</text><path d="M515 75 L563 111" stroke="#315b80" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><rect x="9" y="126" width="219" height="53" rx="6" fill="#ffedce" stroke="#7597ad" stroke-width="1.5"/><text x="118.5" y="158.5" font-size="18" font-weight="400">槽 2，权重 ¾</text><path d="M232 152 L270 152" stroke="#315b80" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><rect x="280" y="126" width="231" height="53" rx="6" fill="#ffedce" stroke="#7597ad" stroke-width="1.5"/><text x="395.5" y="158.5" font-size="18" font-weight="400">[0, 4] × ¾ = [0, 3]</text><path d="M515 152 L563 111" stroke="#315b80" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><rect x="575" y="82" width="209" height="58" rx="6" fill="#e4eff8" stroke="#7597ad" stroke-width="1.5"/><text x="679.5" y="117.0" font-size="18" font-weight="400">逐列相加：[2, 3]</text><text x="400" y="214" font-size="18" font-weight="400">槽号用于读专家缓冲，token 号用于写输出表</text></g></svg>