<svg xmlns="http://www.w3.org/2000/svg" width="690" height="138" viewBox="0 0 690 138" role="img" font-family="Times New Roman,SimHei,sans-serif"><title>四行查询共用一次键值装载，每个分数又给四个值特征重复使用</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#305f82"/></marker></defs><rect x="2" y="5" width="145" height="52" rx="5" fill="#e2effd" stroke="#678197" stroke-width="1.6"/><text x="74.5" y="22.16" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">查询块</text><text x="74.5" y="42.96" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">4 行 Q × 4 维</text><rect x="2" y="81" width="145" height="52" rx="5" fill="#e2effd" stroke="#678197" stroke-width="1.6"/><text x="74.5" y="98.16" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">本次键值块</text><text x="74.5" y="118.96000000000001" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">4 行 K 和 V</text><rect x="177" y="23" width="151" height="88" rx="5" fill="#fae9b7" stroke="#678197" stroke-width="1.6"/><text x="252.5" y="52.040000000000006" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">LDS 分数</text><text x="252.5" y="87.24" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">4 查询 × 4 键</text><rect x="364" y="5" width="140" height="52" rx="5" fill="#ddf2db" stroke="#678197" stroke-width="1.6"/><text x="434.0" y="22.16" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">行最大值、分母</text><text x="434.0" y="42.96" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">每行 1 对状态</text><rect x="364" y="81" width="140" height="52" rx="5" fill="#ddf2db" stroke="#678197" stroke-width="1.6"/><text x="434.0" y="98.16" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">每行分子</text><text x="434.0" y="118.96000000000001" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">每个值列 1 个</text><rect x="541" y="38" width="145" height="55" rx="5" fill="#eddef5" stroke="#678197" stroke-width="1.6"/><text x="613.5" y="56.150000000000006" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">归一化输出</text><text x="613.5" y="78.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">每列 u ÷ l</text><path d="M149 30 L174 40" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M149 105 L174 88" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M331 45 L359 32" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M331 86 L359 105" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M508 32 L538 52" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M508 104 L538 77" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/></svg>
