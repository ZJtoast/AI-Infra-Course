<svg xmlns="http://www.w3.org/2000/svg" width="690" height="114" viewBox="0 0 690 114" role="img" font-family="Times New Roman,SimHei,sans-serif"><title>融合内核从同一个寄存器值分出残差输出，并计算归一化输出</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#305f82"/></marker></defs><rect x="3" y="8" width="155" height="52" rx="5" fill="#e2effd" stroke="#678197" stroke-width="1.6"/><text x="80.5" y="25.16" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">两支输入</text><text x="80.5" y="45.96" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">(2,1,0,−1)+残差</text><rect x="199" y="8" width="148" height="52" rx="5" fill="#fae9b7" stroke="#678197" stroke-width="1.6"/><text x="273.0" y="25.16" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">寄存器中相加</text><text x="273.0" y="45.96" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">u=(0,4,0,0)</text><rect x="389" y="2" width="139" height="46" rx="5" fill="#eddef5" stroke="#678197" stroke-width="1.6"/><text x="458.5" y="17.18" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">残差输出</text><text x="458.5" y="35.58" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">u 原样写回</text><rect x="389" y="64" width="139" height="46" rx="5" fill="#ddf2db" stroke="#678197" stroke-width="1.6"/><text x="458.5" y="79.18" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">归约平方和</text><text x="458.5" y="97.58" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">16，倒数尺度 0.5</text><rect x="561" y="64" width="122" height="46" rx="5" fill="#eddef5" stroke="#678197" stroke-width="1.6"/><text x="622.0" y="79.18" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">归一化输出</text><text x="622.0" y="97.58" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">(0,6,0,0)</text><path d="M162 34 L195 34" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M350 28 L386 24" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M350 45 L386 82" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M532 86 L558 86" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/></svg>
