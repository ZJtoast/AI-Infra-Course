<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 224" role="img"><title>CSR 第零行按边编号取分数、按邻居号取特征</title><defs><marker id="arrow" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#315b80"/></marker></defs><rect height="224" width="810" rx="10" fill="#f5f9fd"/><g font-family="Times New Roman, SimHei, sans-serif" fill="#162d40" text-anchor="middle"><text x="100" y="29" font-size="21" font-weight="700">边号与指数</text><text x="379" y="29" font-size="21" font-weight="700">邻居号与读出的特征</text><text x="675" y="29" font-size="21" font-weight="700">对两通道分子的贡献</text><rect x="11" y="42" width="183" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="102.5" y="66.0" font-size="19" font-weight="400">边 0：¼</text><line x1="197" x2="260" y1="60" y2="60" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="268" y="42" width="220" height="36" rx="7" fill="#dbf2ef" stroke="#7597ad" stroke-width="1.5"/><text x="378.0" y="66.0" font-size="19" font-weight="400">邻居 2：[0, 7]</text><line x1="492" x2="549" y1="60" y2="60" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="557" y="42" width="240" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="677.0" y="66.0" font-size="19" font-weight="400">[0, 7/4]</text><rect x="11" y="87" width="183" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="102.5" y="111.0" font-size="19" font-weight="400">边 1：½</text><line x1="197" x2="260" y1="105" y2="105" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="268" y="87" width="220" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="378.0" y="111.0" font-size="19" font-weight="400">邻居 0：[7, 0]</text><line x1="492" x2="549" y1="105" y2="105" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="557" y="87" width="240" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="677.0" y="111.0" font-size="19" font-weight="400">[7/2, 0]</text><rect x="11" y="132" width="183" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="102.5" y="156.0" font-size="19" font-weight="400">边 2：1</text><line x1="197" x2="260" y1="150" y2="150" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="268" y="132" width="220" height="36" rx="7" fill="#dbf2ef" stroke="#7597ad" stroke-width="1.5"/><text x="378.0" y="156.0" font-size="19" font-weight="400">邻居 2：[0, 7]</text><line x1="492" x2="549" y1="150" y2="150" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="557" y="132" width="240" height="36" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="677.0" y="156.0" font-size="19" font-weight="400">[0, 7]</text><text x="405" y="204" font-size="20" font-weight="700">三条边分别计权，合并后 [7/2, 35/4] ÷ (7/4) = [2, 5]</text></g></svg>