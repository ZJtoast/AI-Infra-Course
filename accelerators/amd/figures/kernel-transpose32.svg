<svg xmlns="http://www.w3.org/2000/svg" width="690" height="138" viewBox="0 0 690 138" role="img" font-family="Times New Roman,SimHei,sans-serif"><title>32 个连续 lane 读取 LDS 的同一列；补一列改变了行距，数值和全局地址保持相同</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#305f82"/></marker></defs><rect x="2" y="2" width="155" height="55" rx="5" fill="#e2effd" stroke="#678197" stroke-width="1.6"/><text x="79.5" y="20.150000000000002" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">同一组 32 个 lane</text><text x="79.5" y="42.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">u = 0,1,2,…,31</text><rect x="193" y="2" width="157" height="55" rx="5" fill="#fae9b7" stroke="#678197" stroke-width="1.6"/><text x="271.5" y="20.150000000000002" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">未补列，读一列</text><text x="271.5" y="42.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">字偏移 0,32,64,…</text><rect x="393" y="2" width="135" height="55" rx="5" fill="#eddef5" stroke="#678197" stroke-width="1.6"/><text x="460.5" y="20.150000000000002" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">各自的 bank</text><text x="460.5" y="42.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">0,0,0,…,0</text><rect x="193" y="78" width="157" height="55" rx="5" fill="#fae9b7" stroke="#678197" stroke-width="1.6"/><text x="271.5" y="96.15" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">补一列，读一列</text><text x="271.5" y="118.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">字偏移 0,33,66,…</text><rect x="393" y="78" width="135" height="55" rx="5" fill="#ddf2db" stroke="#678197" stroke-width="1.6"/><text x="460.5" y="96.15" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">各自的 bank</text><text x="460.5" y="118.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">0,1,2,…,31</text><rect x="566" y="78" width="115" height="55" rx="5" fill="#ddf2db" stroke="#678197" stroke-width="1.6"/><text x="623.5" y="96.15" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#122e42">全局写回</text><text x="623.5" y="118.15" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#122e42">相邻 32 项</text><path d="M160 29 L189 29" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M155 45 L189 89" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M353 29 L388 29" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M353 104 L388 104" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/><path d="M532 104 L563 104" stroke="#305f82" stroke-width="2.6" marker-end="url(#a)" fill="none"/></svg>
