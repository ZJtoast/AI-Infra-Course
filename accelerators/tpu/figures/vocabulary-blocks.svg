<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 224" role="img"><title>两行交叉熵的共同分母与各自的目标分数</title><defs><marker id="arrow" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#315b80"/></marker></defs><rect height="224" width="810" rx="10" fill="#f5f9fd"/><g font-family="Times New Roman, SimHei, sans-serif" fill="#162d40" text-anchor="middle"><text x="120" y="28" font-size="21" font-weight="700">词表块 0</text><text x="398" y="28" font-size="21" font-weight="700">词表块 1</text><text x="678" y="28" font-size="21" font-weight="700">按标签取概率</text><rect x="12" y="71" width="215" height="80" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="119.5" y="105.0" font-size="19" font-weight="400">列 0–127：均为 0</text><text x="119.5" y="129.0" font-size="19" font-weight="400">最大值 0，分母 128</text><line x1="230" x2="269" y1="112" y2="112" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="277" y="69" width="234" height="84" rx="7" fill="#d9f2f1" stroke="#7597ad" stroke-width="1.5"/><text x="394.0" y="105.0" font-size="19" font-weight="400">列 128：ln 4</text><text x="394.0" y="129.0" font-size="19" font-weight="400">128 × ¼ + 1 = 33</text><line x1="514" x2="555" y1="106" y2="75" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="514" x2="555" y1="118" y2="163" stroke="#315b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="563" y="42" width="234" height="59" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="680.0" y="65.5" font-size="19" font-weight="400">标签 128：指数 1</text><text x="680.0" y="89.5" font-size="19" font-weight="400">概率 1/33</text><rect x="563" y="135" width="234" height="59" rx="7" fill="#e3effa" stroke="#7597ad" stroke-width="1.5"/><text x="680.0" y="158.5" font-size="19" font-weight="400">标签 0：指数 ¼</text><text x="680.0" y="182.5" font-size="19" font-weight="400">概率 1/132</text><text x="263" y="202" font-size="17" font-weight="400">两个样本读相同的分数，标签位于不同的块</text></g></svg>